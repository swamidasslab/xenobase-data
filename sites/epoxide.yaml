      Swamidass Lab at https://swami.wustl.edu/, commercial: Commercial license available. Contact 
      the Swamidass Lab at https://swami.wustl.edu/}
  schema: schema/som_molecule.schema.json

  slug: epoxide
  title: Epoxide formation
  som_dataset: xbs:0000005
  paper: {authors: 'Hughes TB, Miller GP, Swamidass SJ', doi: 10.1021/acscentsci.5b00131, journal: 
      ACS Cent Sci, pmid: '27162970', title: Modeling Epoxidation of Drug-like Molecules with a Deep
      Machine Learning Network, year: 2015}
  construction: ['A hop is an epoxide site when Forest applies Epoxidation or the EpoxideHydration composite
      (the hydration is evidence the epoxide formed). The site is the two carbons of the three-membered
      ring, mapped onto the reactant CXSMILES and walked up the path and network.', Partial paths 
      and exact paths longer than five inferred steps are omitted., 'Inferred negatives are accessioned
      molecules in a network that has an epoxide site, with none of their own.']
  conformsTo: [https://datapackage.org/standard/data-package/, https://schema.org/Dataset]
  created: '2026-11-09T04:32:22Z'
  homepage: https://w3id.org/xenosite/xenobase
  licenses:
