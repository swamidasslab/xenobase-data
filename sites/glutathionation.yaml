  title: Glutathionation
  som_dataset: xbs:0000002
  paper: {authors: 'Hughes TB, Miller GP, Swamidass SJ', doi: 10.1021/acs.chemrestox.5b00017, 
      journal: Chem Res Toxicol, pmid: '25742281', title: Site of Reactivity Models Predict 
      Molecular Reactivity of Diverse Chemicals with Glutathione, year: 2015}
  construction: ['A hop is a glutathionation site when Forest applies Glutathionation, or when the observed
      product is a glutathione adduct (a GSH star) even if the path search did not label that hop. Sites
      are mapped onto the reactant CXSMILES and walked back along the pathway and up the network. Only
      accessioned molecules are rows. Most networks here have a single conjugation; molecules without
      a glutathionation site are not listed.', Partial paths and exact paths longer than five 
      inferred steps are omitted. Observed GSH-star adducts still count from the recorded pair when 
      Forest did not label the hop.]
