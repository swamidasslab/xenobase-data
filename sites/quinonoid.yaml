# XenoBase SOM dataset download (one file per slug under sites/<slug>.yaml).
#
# Outer ``meta`` = dataset provenance + SOM catalog fields (title, short, …).
# ``jsonld`` = molecule rows for this table: ``@id`` is the ``xbm:`` molecule;
# ``dataset`` is the ``xbs:`` table accession. Atom indexes in ``soms`` refer to
# ``cxsmiles`` on the same row (chemistry also in molecules.yaml).

meta:
  dataset: xenobase-sites-quinonoid
  about: Sites that form a quinone, imine, or methide, with inferred negatives from the same 
    networks.
  access: login
  license: {id: CC-BY-NC-4.0, name: Creative Commons Attribution-NonCommercial 4.0 International, 
      url: https://creativecommons.org/licenses/by-nc/4.0/, notice: NOTICE, summary: Academic and 
      other non-commercial use under CC BY-NC 4.0. Commercial licenses are available — contact the 
      Swamidass Lab at https://swami.wustl.edu/, commercial: Commercial license available. Contact 
      the Swamidass Lab at https://swami.wustl.edu/}
  schema: schema/som_molecule.schema.json

  slug: quinonoid
  title: Quinonoid formation
  som_dataset: xbs:0000004
  paper: {authors: 'Hughes TB, Swamidass SJ', doi: 10.1021/acs.chemrestox.6b00385, journal: Chem Res
      Toxicol, pmid: '28099803', title: Deep Learning to Predict the Formation of Quinone Species in
      Drug Metabolism, year: 2017}
  construction: ['A hop is quinonoid when Forest applies QuinoneFormation, or a component Dehydrogenation
      of two conjugated endpoints, and the site is aromatic on the reactant while the mapped product keeps
      a localized (non-aromatic) double bond there. Non-aromatic enols and hops that re-aromatize are
      dropped — QuinoneFormation fires on those, but they are not quinones.', Partial paths and 
      exact paths longer than five inferred steps are omitted., 'Sites walk the path and the network.
      Inferred negatives are accessioned neighbors in a network that has a quinonoid site, with no quinonoid
      site of their own.']
  conformsTo: [https://datapackage.org/standard/data-package/, https://schema.org/Dataset]
  created: '2026-11-11T21:34:30Z'
  homepage: https://w3id.org/xenosite/xenobase
  licenses:
  - {name: CC-BY-NC-4.0, path: https://creativecommons.org/licenses/by-nc/4.0/, title: Creative 
      Commons Attribution-NonCommercial 4.0 International}
  sources:
  - {title: XenoBase Sources (upstream databases), path: https://w3id.org/xenosite/xenobase/sources}
  citation: {title: Deep Learning to Predict the Formation of Quinone Species in Drug Metabolism, 
      authors: 'Hughes TB, Swamidass SJ', journal: Chem Res Toxicol, year: 2017, doi: 
      10.1021/acs.chemrestox.6b00385, pmid: '28099803', url: 
      https://doi.org/10.1021/acs.chemrestox.6b00385}
  software:
